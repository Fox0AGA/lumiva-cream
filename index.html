<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMIVA - كريم لوميفا</title>
<style>
body{
background: #fff0f5 !important; /* وردي فاتح جدا */
}
.hero{max-width:500px;margin:auto;background:#fff;padding:20px;text-align:center}
.hero img{width:90%;max-width:350px;border-radius:15px}
h1{color:#d81b60;font-size:24px;margin:10px 0}
.price{font-size:22px;color:#333;margin:10px 0}
.old{color:#999;text-decoration:line-through}
.new{color:#d81b60;font-weight:bold;font-size:28px}
.btn{display:block;padding:15px;border-radius:30px;text-decoration:none;color:#fff;font-weight:bold;margin:10px 0}
.btn-green{background:#25D366}
.btn-outline{border:2px solid #ff4081;color:#ff4081;background:#fff}
.form{background:#fff0f5;padding:15px;border-radius:15px;margin-top:15px;text-align:right}
.form input,.form select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ddd;box-sizing:border-box}
</style>
</head>
<body>
<div class="hero">
<img src="./lumiva.jpg" alt="كريم لوميفا">
<h1>LUMIVA By AGA 👑</h1>
<p>سر التفتيح الآمن والنتيجة اللي هتشوفيها بنفسك ✨</p>

<div class="price">
<span class="old">900ج</span> <span class="new">600ج</span> لعبوة 200 مل<br>
<span style="font-size:16px">عبوة 30 مل بـ 160ج بدل 190ج</span>
</div>

<a href="#order" class="btn btn-green">اطلبي الآن والدفع عند الاستلام 🚚</a>

<!-- ده الزرار الجديد اللي طلبته -->
<a href="./details.html" class="btn btn-outline">📖 اعرفي تفاصيل أكتر عن المنتج</a>

<div class="form" id="order" style="background: linear-gradient(135deg, #ffc2d1, #ffb3c6); padding:25px; border-radius:25px; max-width:500px; margin:20px auto; border:3px solid #ff8fab; box-shadow: 0 8px 25px rgba(255, 105, 180, 0.3)">
<h3 style="text-align:center">👇 اطلبي الآن</h3>

<input type="text" id="fullName" placeholder="الاسم ثلاثي *" style="width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #ddd">

<input type="tel" id="phone1" placeholder="رقم الموبايل *" style="width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #ddd">

<input type="tel" id="phone2" placeholder="رقم موبايل 2 (اختياري)" style="width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #ddd">

<select id="gov" onchange="calcTotal()" style="width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #ddd">
<option value="">اختاري المحافظة *</option>
<option value="القاهرة|100">القاهرة - شحن 100ج</option>
<option value="الجيزة|100">الجيزة - شحن 100ج</option>
<option value="القليوبية|100">القليوبية - شحن 100ج</option>
<option value="الإسكندرية|100">الإسكندرية - شحن 100ج</option>
<option value="البحيرة|100">البحيرة - شحن 100ج</option>
<option value="كفر الشيخ|100">كفر الشيخ - شحن 100ج</option>
<option value="الغربية|100">الغربية - شحن 100ج</option>
<option value="المنوفية|100">المنوفية - شحن 100ج</option>
<option value="الدقهلية|100">الدقهلية - شحن 100ج</option>
<option value="دمياط|100">دمياط - شحن 100ج</option>
<option value="الشرقية|100">الشرقية - شحن 100ج</option>
<option value="بورسعيد|100">بورسعيد - شحن 100ج</option>
<option value="الإسماعيلية|100">الإسماعيلية - شحن 100ج</option>
<option value="السويس|100">السويس - شحن 100ج</option>
<option value="الفيوم|80">الفيوم - شحن 80ج</option>
<option value="بني سويف|80">بني سويف - شحن 80ج</option>
<option value="المنيا|80">المنيا - شحن 80ج</option>
<option value="أسيوط|80">أسيوط - شحن 80ج</option>
<option value="سوهاج|80">سوهاج - شحن 80ج</option>
<option value="قنا|70">قنا - شحن 70ج</option>
<option value="الأقصر|50">الأقصر - شحن 50ج</option>
<option value="أسوان|70">أسوان - شحن 70ج</option>
<option value="البحر الأحمر|70">البحر الأحمر - شحن 70ج</option>
<option value="الوادي الجديد|100">الوادي الجديد - شحن 100ج</option>
<option value="مطروح|100">مطروح - شحن 100ج</option>
<option value="شمال سيناء|100">شمال سيناء - شحن 100ج</option>
<option value="جنوب سيناء|100">جنوب سيناء - شحن 100ج</option>
</select>

<input type="text" id="address" placeholder="العنوان بالتفصيل *" style="width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #ddd">

<select id="size" onchange="calcTotal()" style="width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #ddd">
<option value="">اختاري حجم العبوة *</option>
<option value="200 مل|600">200 مل - 600ج</option>
<option value="30 مل|160">30 مل - 160ج</option>
</select>

<select id="qty" onchange="calcTotal()" style="width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #ddd">
<option value="1">الكمية: 1</option>
<option value="2">الكمية: 2</option>
<option value="3">الكمية: 3</option>
<option value="4">الكمية: 4</option>
<option value="5">الكمية: 5</option>
</select>

<div id="totalBox" style="background:#ffe4e6; border:2px dashed #ff4081">
<p>المنتج: <span id="pPrice">0</span>ج × <span id="qShow">1</span> = <span id="pTotal">0</span>ج</p>
<p>الشحن: <span id="sPrice">0</span>ج</p>
<h3 style="color:#d81b60">الإجمالي: <span id="grandTotal">0</span>ج</h3>
</div>

<a href="#" onclick="sendOrder()" style="display:block;background: linear-gradient(90deg, #d4af37, #ffd700, #ffb700); color:#4a2c00; text-align:center; padding:18px; border-radius:30px; text-decoration:none; font-weight:bold; font-size:19px; letter-spacing:0.5px; box-shadow: 0 6px 20px rgba(212,175,55,0.5); border:2px solid #fff; text-shadow: 0 1px 0 rgba(255,255,255,0.5)">✨ تأكيد الطلب على واتساب ✨</a>
</div>

<script>
let prod=0, ship=0, govName='', sizeName='';
function calcTotal(){
let g=document.getElementById('gov').value;
let s=document.getElementById('size').value;
let q=document.getElementById('qty').value;
if(!g || !s) return;
let gp=g.split('|'); let sp=s.split('|');
govName=gp[0]; ship=parseInt(gp[1]);
sizeName=sp[0]; prod=parseInt(sp[1]);
let qty=parseInt(q);
let prodTotal=prod*qty;
document.getElementById('pPrice').innerText=prod;
document.getElementById('qShow').innerText=qty;
document.getElementById('pTotal').innerText=prodTotal;
document.getElementById('sPrice').innerText=ship;
document.getElementById('grandTotal').innerText=prodTotal+ship;
document.getElementById('totalBox').style.display='block';
}
function sendOrder(){
let name=document.getElementById('fullName').value.trim();
let p1=document.getElementById('phone1').value.trim();
let p2=document.getElementById('phone2').value.trim()||'لا يوجد';
let addr=document.getElementById('address').value.trim();
let qty=document.getElementById('qty').value;
if(name.split(' ').length<3){alert('اكتبي الاسم ثلاثي');return;}
if(!p1||!document.getElementById('gov').value||!addr||!document.getElementById('size').value){alert('اكملي البيانات');return;}
calcTotal();
let prodTotal=prod*parseInt(qty);
let grand=prodTotal+ship;
let msg=`طلب LUMIVA%0Aالاسم: ${name}%0Aموبايل1: ${p1}%0Aموبايل2: ${p2}%0Aالمحافظة: ${govName}%0Aسعر الشحن: ${ship}ج%0Aالعنوان: ${addr}%0Aالحجم: ${sizeName}%0Aالكمية: ${qty}%0Aحساب المنتج: ${prod}×${qty}=${prodTotal}ج%0Aالإجمالي: ${grand}ج`;
window.open(`https://wa.me/201550785556?text=${msg}`,'_blank');
}
</script>

<a href="./reviews.html" class="btn btn-outline">⭐ شوفي رأي البنات اللي اشترت</a>
</div>
</body>
</html>
