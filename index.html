<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMIVA - كريم لوميفا</title>
<style>
body{margin:0;font-family:Tahoma,Arial;background:#fff5f8}
.hero{max-width:500px;margin:auto;background:#fff;padding:20px;text-align:center}
.hero img{width:90%;max-width:350px;border-radius:15px}
h1{color:#d81b60;font-size:24px;margin:10px 0}
.price{font-size:22px;color:#333;margin:10px 0}
.old{color:#999;text-decoration:line-through}
.new{color:#d81b60;font-weight:bold;font-size:28px}
.btn{display:block;padding:15px;border-radius:30px;text-decoration:none;color:#fff;font-weight:bold;margin:10px 0}
.btn-green{background:#25D366}
.btn-outline{border:2px solid #ff4081;color:#ff4081;background:#fff}
.form{background:#fff0f5;padding:15px;border-radius:15px;margin-top:15px;text-align:right}
.form input,.form select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ddd;box-sizing:border-box}
</style>
</head>
<body>
<div class="hero">
<img src="./lumiva.jpg" alt="كريم لوميفا">
<h1>LUMIVA By AGA 👑</h1>
<p>سر التفتيح الآمن والنتيجة اللي هتشوفيها بنفسك ✨</p>

<div class="price">
<span class="old">900ج</span> <span class="new">600ج</span> لعبوة 200 مل<br>
<span style="font-size:16px">عبوة 30 مل بـ 160ج بدل 190ج</span>
</div>

<a href="#order" class="btn btn-green">اطلبي الآن والدفع عند الاستلام 🚚</a>

<!-- ده الزرار الجديد اللي طلبته -->
<a href="./details.html" class="btn btn-outline">📖 اعرفي تفاصيل أكتر عن المنتج</a>

<div class="form" id="order">
<h3 style="text-align:center;color:#d81b60">اطلبي الآن 👇</h3>

<label>الاسم ثلاثي *</label>
<input type="text" id="name" placeholder="مثال: أحمد محمد علي" required>

<label>رقم الموبايل *</label>
<input type="tel" id="phone1" placeholder="010xxxxxxxx" required>

<label>رقم موبايل 2 (اختياري)</label>
<input type="tel" id="phone2" placeholder="اختياري - لو مش عايز تسيبه فاضي">

<label>المحافظة *</label>
<select id="gov" required onchange="calcTotal()" style="width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #ddd">
<option value="">اختاري المحافظة * - سعر الشحن</option>
<option value="القاهرة|100">القاهرة - شحن 100ج</option>
<option value="الجيزة|100">الجيزة - شحن 100ج</option>
<option value="القليوبية|100">القليوبية - شحن 100ج</option>
<option value="الإسكندرية|100">الإسكندرية - شحن 100ج</option>
<option value="البحيرة|100">البحيرة - شحن 100ج</option>
<option value="كفر الشيخ|100">كفر الشيخ - شحن 100ج</option>
<option value="الغربية|100">الغربية - شحن 100ج</option>
<option value="المنوفية|100">المنوفية - شحن 100ج</option>
<option value="الدقهلية|100">الدقهلية - شحن 100ج</option>
<option value="دمياط|100">دمياط - شحن 100ج</option>
<option value="الشرقية|100">الشرقية - شحن 100ج</option>
<option value="بورسعيد|100">بورسعيد - شحن 100ج</option>
<option value="الإسماعيلية|100">الإسماعيلية - شحن 100ج</option>
<option value="السويس|100">السويس - شحن 100ج</option>
<option value="الفيوم|80">الفيوم - شحن 80ج</option>
<option value="بني سويف|80">بني سويف - شحن 80ج</option>
<option value="المنيا|80">المنيا - شحن 80ج</option>
<option value="أسيوط|80">أسيوط - شحن 80ج</option>
<option value="سوهاج|80">سوهاج - شحن 80ج</option>
<option value="قنا|70">قنا - شحن 70ج</option>
<option value="الأقصر|50">الأقصر - شحن 50ج</option>
<option value="أسوان|70">أسوان - شحن 70ج</option>
<option value="البحر الأحمر|70">البحر الأحمر - شحن 70ج</option>
<option value="الوادي الجديد|100">الوادي الجديد - شحن 100ج</option>
<option value="مطروح|100">مطروح - شحن 100ج</option>
<option value="شمال سيناء|100">شمال سيناء - شحن 100ج</option>
<option value="جنوب سيناء|100">جنوب سيناء - شحن 100ج</option>
</select>
</select>

<label>العنوان بالتفصيل *</label>
<input type="text" id="address" placeholder="الشارع - رقم البيت - علامة مميزة" required>

<label>حجم العبوة *</label>
<select id="size" required>
<option value="">اختاري الحجم</option>
<option value="200 مل - 600ج">200 مل - 600ج</option>
<option value="30 مل - 160ج">30 مل - 160ج</option>
</select>

<a href="#" class="btn btn-green" onclick="sendOrder()">تأكيد الطلب على واتساب ✅</a>
<p style="font-size:12px;text-align:center">* الحقول بعلامة * اجبارية - الدفع عند الاستلام</p>
</div>

<script>
function sendOrder(){
let name=document.getElementById('name').value;
let p1=document.getElementById('phone1').value;
let p2=document.getElementById('phone2').value;
let gov=document.getElementById('gov').value;
let addr=document.getElementById('address').value;
let size=document.getElementById('size').value;

if(!name || !p1 || !gov || !addr || !size){
alert('من فضلك اكملي كل البيانات المطلوبة');
return;
}

let msg=`طلب جديد LUMIVA%0A%0Aالاسم: ${name}%0Aموبايل 1: ${p1}%0Aموبايل 2: ${p2}%0Aالمحافظة: ${gov}%0Aالعنوان: ${addr}%0Aالحجم: ${size}`;
window.open(`https://wa.me/201550785556?text=${msg}`, '_blank');
}
</script>

<a href="./reviews.html" class="btn btn-outline">⭐ شوفي رأي البنات اللي اشترت</a>
</div>
</body>
</html>
